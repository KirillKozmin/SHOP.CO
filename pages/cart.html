<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP.CO</title>
    <link rel="stylesheet" href="../style/cart/cart.css">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <p class="header__start">
                Sign up and get 20% off to your first order.<a href="#" class="Sign_Up_Now">Sign Up Now</a>
            </p>
            <a class="header__cross" href="./home.html">x</a>
        </div>
    </header>
    <main>
        <section class="section__one">
            <div class="section__one-container">
                <a href="./home.html"><img src="../img/SHOP.CO.svg" alt="SHOP.CO"></a>
                <nav>
                    <ul>
                        <li><a href="#0">Shop<img class="section__one-check_mark" src="/img/downward arrow.svg"></a>
                        </li>
                        <li><a href="#0">On Sale</a></li>
                        <li><a href="#0">New Arrivals</a></li>
                        <li><a href="#0">Brands</a></li>
                    </ul>
                </nav>
                <div class="section__one-search_wrapper">
                    <img class="section__one-search_icon" src="/img/magnifier.svg">

                </div>
                <div class="section__one-main_icons">

            </div>
        </section>
        <section class="section__two">
            <div class="section__two-container_line">
                <hr class="section__two-line-one">
            </div>
            <div class="section__two-navigation_chain">
                <p>Home</p>
                <img src="/img/arrow to the right.svg" class="arrow-right">
                <a>Casual</a>
            </div>
        </section>
        <section>
            <h2 class="yer">Your cart</h2>
        </section>

</html>
